version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ba_challenge_db
    restart: always
    environment:
      # Подтягиваем значения напрямую из вашего .env
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
